[package]
name = "nexora"
version = "0.1.0"
edition = "2021"
authors = ["Nexora Contributors <engineering@nexora.dev>"]
license = "MIT OR Apache-2.0"
description = "Official asynchronous Rust SDK for the Nexora infrastructure engine."

[dependencies]
tokio = { version = "1.38", features = ["net", "io-util", "sync", "time"] }
bytes = "1.6"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
