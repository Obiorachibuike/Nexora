[workspace]
resolver = "2"
members = [
    "crates/nexora-core",
    "crates/nexora-protocol",
    "crates/nexora-storage",
    "crates/nexora-cache",
    "crates/nexora-queue",
    "crates/nexora-events",
    "crates/nexora-scheduler",
    "crates/nexora-workers",
    "crates/nexora-auth",
    "crates/nexora-metrics",
    "crates/nexora-admin",
    "crates/nexora-server",
    "crates/nexora-cli",
    "crates/nexora-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Nexora Contributors <engineering@nexora.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Obiorachibuike/Nexora"
homepage = "https://nexora.dev"
description = "Independent infrastructure engine combining durable background jobs, key-value storage, caching, event messaging, and scheduling."

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
bytes = "1.6"
byteorder = "1.5"
crc32fast = "1.4"
sha2 = "0.10"
subtle = "2.5"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
uuid = { version = "1.8", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
toml = "0.8"
